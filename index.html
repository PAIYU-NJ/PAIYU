<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IP业务管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#1a3a5c;--primary-light:#2a5a7a;--accent:#3b8fc2;--bg:#f0f4f9;--card-bg:#fff;--text:#1e2a3a;--text-light:#5a6a7a;--border:#dce4ec;--shadow:0 8px 30px rgba(0,0,0,.08);--radius:12px;--radius-sm:8px;--font:'Segoe UI',system-ui,-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:24px;min-height:100vh}
.container{max-width:1440px;margin:0 auto}
.hidden{display:none!important}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:28px}
.header-left{display:flex;align-items:center;gap:14px}
.header-left .logo{width:44px;height:44px;background:var(--primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.header-left h1{font-size:26px;font-weight:700;color:var(--primary)}
.header-left h1 span{color:var(--accent)}
.header-left .subtitle{font-size:14px;color:var(--text-light);margin-top:2px}
.header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header-actions .btn{font-size:14px;padding:10px 20px}
.workflow-tip{background:#eef6fc;border-radius:var(--radius-sm);padding:10px 18px;font-size:14px;color:var(--primary);border:1px solid #d0e2f0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.workflow-tip i{color:var(--accent)}
.workflow-tip .step{font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;transition:.25s;font-family:var(--font);background:var(--border);color:var(--text)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:#6ab0d9}
.btn-success{background:#2d8f5e;color:#fff}
.btn-danger{background:#c0392b;color:#fff}.btn-danger:hover{background:#a93226}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text-light)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px}
.stat-card .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.stat-card .icon.blue{background:var(--accent)}.stat-card .icon.red{background:#c0392b}
.stat-card .icon.orange{background:#e67e22}.stat-card .icon.purple{background:#8e44ad}
.stat-card .icon.teal{background:#1abc9c}.stat-card .icon.pink{background:#e84393}
.stat-card .icon.green{background:#2d8f5e}
.stat-card .info .number{font-size:28px;font-weight:700;line-height:1.2;color:var(--primary)}
.stat-card .info .label{font-size:14px;color:var(--text-light);font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px;background:var(--card-bg);padding:14px 20px;border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar-left{display:flex;flex-wrap:wrap;gap:12px;align-items:center;flex:1}
.toolbar-left .search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--radius-sm);padding:0 14px;border:1px solid var(--border);flex:1;min-width:200px;max-width:360px}
.toolbar-left .search-box input{border:none;background:transparent;padding:10px 0;font-size:15px;outline:none;flex:1;font-family:var(--font)}
.toolbar-left .filter-group{display:flex;gap:6px;flex-wrap:wrap}
.toolbar-left .filter-group .filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;font-size:13px;cursor:pointer;font-family:var(--font);color:var(--text-light);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.toolbar-left .filter-group .filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.toolbar-left .filter-group .filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar-left .filter-group .filter-btn.tag-filter{background:#f0f0f0;border-color:#ccc}
.toolbar-left .filter-group .filter-btn.tag-filter.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ===== 视图切换按钮（活跃/归档/全部） ===== */
.view-btn{padding:7px 14px !important;border-radius:8px !important;font-weight:600 !important}
.view-btn .view-count{display:inline-block;background:rgba(0,0,0,.08);border-radius:8px;padding:0 6px;font-size:11px;margin-left:2px;font-weight:600;line-height:16px;min-width:18px;text-align:center}
.view-btn.active .view-count{background:rgba(255,255,255,.28)}
.view-btn[data-view="archived"]{border-color:#d1d5db;color:#6b7280}
.view-btn[data-view="archived"].active{background:#6b7280;border-color:#6b7280;color:#fff}
.view-btn[data-view="archived"]:hover{border-color:#6b7280;color:#6b7280}
/* 视图按钮组与类型筛选之间的分隔线 */
.toolbar-left .view-group-wrapper{display:flex;align-items:center;gap:12px}
.toolbar-left .view-group-wrapper::after{content:'';display:block;width:1px;height:24px;background:var(--border)}
.toolbar-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar-right .selected-info{font-size:14px;color:var(--text-light);margin-right:8px}
.toolbar-right .batch-actions{display:flex;gap:6px;align-items:center}
.toolbar-right .batch-actions select{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:14px;background:#fafbfc;font-family:var(--font)}
.table-wrap{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;overflow-x:auto}
.table-wrap table{width:100%;border-collapse:collapse;font-size:14px;min-width:1300px}
.table-wrap table th{background:var(--bg);font-weight:600;color:var(--text-light);padding:14px 16px;text-align:left;border-bottom:2px solid var(--border);font-size:13px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;cursor:pointer}
.table-wrap table th i{margin-left:6px;font-size:12px;opacity:.5}
.table-wrap table td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.table-wrap table tbody tr:nth-child(odd){background-color:#fff}
.table-wrap table tbody tr:nth-child(even){background-color:#f8fafc}
.table-wrap table tbody tr:hover{background-color:#eef2f6}
.table-wrap table tbody tr.selected{background-color:rgba(59,143,194,.12)!important}
.table-wrap .case-id{font-weight:600;color:var(--primary);font-size:13px;white-space:nowrap}
.status-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.status-receive{background:#dbeafe;color:#1a56db}
.status-processing{background:#fef3c7;color:#b45309}
.status-pending-submit{background:#e0e7ff;color:#4338ca}
.status-submitted{background:#d1fae5;color:#065f46}
.status-payment{background:#fce4ec;color:#b71c1c}
.status-transferred{background:#e5e7eb;color:#374151}
.priority-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.priority-high{background:#fee2e2;color:#991b1b}
.priority-medium{background:#fef3c7;color:#92400e}
.priority-low{background:#e0e7ff;color:#3730a3}
.importance-stars{color:#f59e0b;letter-spacing:2px}
.tag-list{display:flex;flex-wrap:wrap;gap:4px}
.tag-item{background:#e5e7eb;color:#374151;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:500;white-space:nowrap}
.table-wrap .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.table-wrap .empty-state{text-align:center;padding:60px 20px;color:var(--text-light)}
.table-wrap .empty-state i{font-size:48px;color:var(--border);margin-bottom:16px;display:block}
input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.checkbox-col{text-align:center;width:40px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay .modal{background:var(--card-bg);border-radius:var(--radius);max-width:820px;width:100%;max-height:90vh;overflow-y:auto;padding:32px 36px;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.modal .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.modal .modal-header h2{font-size:22px;font-weight:700;color:var(--primary)}
.modal .modal-header .close-btn{width:36px;height:36px;border:none;background:var(--bg);border-radius:50%;font-size:18px;cursor:pointer;color:var(--text-light);display:flex;align-items:center;justify-content:center}
.modal .modal-header .close-btn:hover{background:#e2e8f0;transform:rotate(90deg)}
.modal .form-group{margin-bottom:18px}
.modal .form-group label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.modal .form-group label .required{color:#c0392b}
.modal .form-group label .hint{font-weight:400;color:var(--text-light);font-size:12px;margin-left:8px}
.modal .form-group input,.modal .form-group select,.modal .form-group textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:var(--font);background:#fafbfc}
.modal .form-group input:focus,.modal .form-group select:focus,.modal .form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,143,194,.12)}
.modal .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.modal .form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.batch-table{width:100%;border-collapse:collapse;margin-top:10px}
.batch-table th,.batch-table td{border:1px solid var(--border);padding:8px 10px;text-align:left;font-size:14px}
.batch-table th{background:var(--bg);font-weight:600}
.batch-table input{width:100%;border:1px solid transparent;padding:6px 8px;border-radius:4px;font-size:14px;background:transparent;font-family:var(--font)}
.batch-table input:focus{border-color:var(--accent);background:#fff;outline:none}
.batch-table .remove-row-btn{color:#c0392b;cursor:pointer;font-size:16px;background:none;border:none}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.detail-item{display:flex;flex-direction:column;gap:4px}
.detail-item .label{font-size:13px;font-weight:600;color:var(--text-light)}
.detail-item .value{font-size:15px;word-break:break-word}
.detail-item.full-width{grid-column:1/-1}
.toast-container{position:fixed;top:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:10px;max-width:380px;width:100%}
.toast{background:var(--card-bg);padding:14px 20px;border-radius:var(--radius-sm);box-shadow:0 8px 28px rgba(0,0,0,.13);display:flex;align-items:center;gap:12px;border-left:4px solid var(--accent);animation:slideInRight .35s}
.toast.success{border-left-color:#2d8f5e}.toast.error{border-left-color:#c0392b}
.toast .toast-icon{font-size:20px;flex-shrink:0}
.toast.success .toast-icon{color:#2d8f5e}.toast.error .toast-icon{color:#c0392b}
.toast .toast-msg{flex:1;font-size:14px;font-weight:500}
.toast .toast-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--text-light)}
@keyframes slideInRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
.login-overlay{position:fixed;inset:0;background:rgba(26,58,92,.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:3000}
.login-card{background:#fff;border-radius:var(--radius);padding:40px 44px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.login-card h2{color:var(--primary);margin-bottom:8px;font-size:24px}
.login-card p{color:var(--text-light);font-size:14px;margin-bottom:24px}
.login-card .form-group{margin-bottom:16px}
.login-card .form-group label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.login-card .form-group input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:var(--font);background:#fafbfc}
.login-card .form-group input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,143,194,.12)}
.login-card .btn{width:100%;justify-content:center;margin-top:8px}
.text-muted{color:var(--text-light)}
@media (max-width:820px){
  .modal .form-row{grid-template-columns:1fr}
  .modal{padding:24px 20px!important}
  .detail-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>登录 IP 管理系统</h2>
    <p>使用管理员分配的邮箱账号登录</p>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="密码" />
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
      <i class="fas fa-sign-in-alt"></i> <span id="loginBtnText">登录</span>
    </button>
    <div style="margin-top:12px;font-size:12px;color:#c0392b;text-align:center;min-height:18px;" id="loginError"></div>
  </div>
</div>

<div class="container" id="mainApp" style="display:none;">
  <header class="header">
    <div class="header-left">
      <div class="logo"><i class="fas fa-scale-balanced"></i></div>
      <div>
        <h1>IP<span>全业务</span>管理</h1>
        <div class="subtitle">云端同步 · 数据隔离 · 批量新建 · 客户/联系人记忆 · 自动归档</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline btn-sm" onclick="exportCSV()"><i class="fas fa-file-export"></i> 导出</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('importInput').click()"><i class="fas fa-file-import"></i> 导入</button>
      <input type="file" id="importInput" accept=".csv" style="display:none;" onchange="importCSV(event)" />
      <button class="btn btn-success btn-sm" onclick="openBatchModal()"><i class="fas fa-layer-group"></i> 批量新建</button>
      <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> 新建案件</button>
      <button class="btn btn-outline btn-sm" onclick="doLogout()" title="退出"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </header>

  <div class="workflow-tip">
    <i class="fas fa-arrow-right"></i>
    <span>流程：</span>
    <span class="step">收案</span> <i class="fas fa-chevron-right"></i>
    <span class="step">处理中</span> <i class="fas fa-chevron-right"></i>
    <span class="step">待提交</span> <i class="fas fa-chevron-right"></i>
    <span class="step">已提交受理</span> <i class="fas fa-chevron-right"></i>
    <span class="step">协助缴费</span> <i class="fas fa-chevron-right"></i>
    <span class="step" style="color:#2d8f5e;">已移交专人</span>
    <span style="margin-left:8px;font-size:12px;color:#6b7280;background:#e5e7eb;padding:2px 8px;border-radius:10px;"><i class="fas fa-archive"></i> 「协助缴费/已移交专人」自动归档</span>
    <span style="margin-left:auto;font-size:13px;color:var(--text-light);" id="syncStatus"><i class="fas fa-cloud"></i> 正在连接...</span>
  </div>

  <section class="stats" id="statsContainer"></section>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="搜索名称、客户、编号..." oninput="renderTable()" />
      </div>
      <!-- ===== 视图切换（活跃 / 归档 / 全部） ===== -->
      <div class="view-group-wrapper">
        <div class="filter-group" id="viewGroup">
          <button class="filter-btn view-btn active" data-view="active" onclick="setView('active')" title="仅显示进行中的案件">
            <i class="fas fa-briefcase"></i> 活跃 <span class="view-count" id="viewCountActive">0</span>
          </button>
          <button class="filter-btn view-btn" data-view="archived" onclick="setView('archived')" title="显示已结束的案件（协助缴费/已移交专人）">
            <i class="fas fa-archive"></i> 归档 <span class="view-count" id="viewCountArchived">0</span>
          </button>
          <button class="filter-btn view-btn" data-view="all" onclick="setView('all')" title="显示全部案件">
            <i class="fas fa-list"></i> 全部 <span class="view-count" id="viewCountAll">0</span>
          </button>
        </div>
      </div>
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-type="all" onclick="setTypeFilter('all')">全部</button>
        <button class="filter-btn" data-type="专利代理" onclick="setTypeFilter('专利代理')">专利代理</button>
        <button class="filter-btn" data-type="专利侵权与规避" onclick="setTypeFilter('专利侵权与规避')">侵权与规避</button>
        <button class="filter-btn" data-type="软件著作权登记" onclick="setTypeFilter('软件著作权登记')">软著登记</button>
        <button class="filter-btn" data-type="商标代理" onclick="setTypeFilter('商标代理')">商标代理</button>
        <button class="filter-btn" data-type="专利检索" onclick="setTypeFilter('专利检索')">检索</button>
        <button class="filter-btn" data-type="缴费监控" onclick="setTypeFilter('缴费监控')">缴费监控</button>
      </div>
      <div class="filter-group" id="tagFilterGroup"></div>
    </div>
    <div class="toolbar-right">
      <span class="selected-info" id="selectedInfo">已选 0 件</span>
      <div class="batch-actions">
        <select id="batchStatusSelect">
          <option value="">批量修改状态...</option>
          <option value="收案">收案</option>
          <option value="处理中">处理中</option>
          <option value="待提交">待提交</option>
          <option value="已提交受理">已提交受理</option>
          <option value="协助缴费">协助缴费</option>
          <option value="已移交专人">已移交专人</option>
        </select>
        <button class="btn btn-accent btn-sm" onclick="batchUpdateStatus()">应用</button>
        <button class="btn btn-danger btn-sm" onclick="batchDelete()">删除选中</button>
      </div>
      <span class="text-muted" style="font-size:14px;" id="resultCount">共 0 件</span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="checkbox-col"><input type="checkbox" id="selectAll" onchange="toggleAllCheckboxes()" /></th>
          <th onclick="sortTable('caseNumber')">编号 <i class="fas fa-sort"></i></th>
          <th onclick="sortTable('caseName')">案件名称 <i class="fas fa-sort"></i></th>
          <th onclick="sortTable('clientName')">客户 <i class="fas fa-sort"></i></th>
          <th onclick="sortTable('caseType')">业务类型 <i class="fas fa-sort"></i></th>
          <th onclick="sortTable('priority')">优先级 <i class="fas fa-sort"></i></th>
          <th onclick="sortTable('importance')">重要性 <i class="fas fa-sort"></i></th>
          <th onclick="sortTable('status')">状态 <i class="fas fa-sort"></i></th>
          <th>标签</th>
          <th style="text-align:center;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div style="margin-top:24px;text-align:center;font-size:13px;color:var(--text-light);">
    <i class="fas fa-cloud"></i> 已同步到云端 · 共 <span id="totalCountFooter">0</span> 件
  </div>
</div>

<!-- ===== 新建/编辑模态框 ===== -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新建案件</h2>
      <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <form id="caseForm" onsubmit="saveCase(event)">
      <input type="hidden" id="editId" value="" />
      <input type="hidden" id="editVersion" value="" />
      <div class="form-row">
        <div class="form-group">
          <label>案件编号 <span class="required">*</span> <span class="hint">自动生成，可修改</span></label>

function fromDB(row){
  const o = { id: row.id, version: row.version ?? 1 };
  for (const [db,ui] of Object.entries(DB_TO_UI)) o[ui] = row[db] ?? '';
  o.importance = String(o.importance || 3);
  return o;
}

function toDB(c){
  const o = {};
  for (const [db,ui] of Object.entries(DB_TO_UI)){
    if (ui === 'createTime' || ui === 'updateTime') continue;
    let v = c[ui];
    if (v === '' || v === undefined) v = null;
    if (ui === 'importance') v = parseInt(v) || 3;
    o[db] = v;
  }
  return o;
}

}
function fmtDate(d){ if(!d) return '-'; const p=d.split('-'); return `${p[0]}年${parseInt(p[1])}月${parseInt(p[2])}日`; }
function getStatusClass(s){ return STATUS_CLASS[s] || ''; }
function getPriorityClass(p){ return {'高':'priority-high','中':'priority-medium','低':'priority-low'}[p] || 'priority-medium'; }

function generateCaseNumber(){
  if (document.getElementById('editId').value) return;
  const type = document.getElementById('f_caseType').value;
  const date = document.getElementById('f_receiveDate').value;
  if (!type || !date) return;
  document.getElementById('f_caseNumber').value = generateBatchNumber(type, date, []);
}

// 供单件与批量共用的编号生成器
function generateBatchNumber(type, date, extraNumbers){
  const prefix = TYPE_PREFIX[type] || 'QT';
  const year = (date || '').substring(0,4);
  let maxSeq = 0;
  const all = cases.map(c => c.caseNumber).concat(extraNumbers || []);
  all.forEach(num => {
    if (!num) return;
    const p = String(num).split('-');
    if (p.length===3 && p[0]===prefix && p[1]===year){
      const s = parseInt(p[2],10);
      if (!isNaN(s) && s>maxSeq) maxSeq = s;
    }
  });
  return `${prefix}-${year}-${String(maxSeq+1).padStart(3,'0')}`;
}

function renderStats(){
  const total = cases.length;
  const activeCount = cases.filter(c => !ENDED_STATUSES.includes(c.status)).length;
  const archivedCount = total - activeCount;
  const byType = {}, byPriority = {'高':0,'中':0,'低':0};
  cases.forEach(c => {
    const t = c.caseType || '其他';
    byType[t] = (byType[t]||0)+1;
    const p = c.priority || '中';
    if (byPriority[p] !== undefined) byPriority[p]++;
  });
  const typeMap = {
    '专利代理':{icon:'fa-gavel',color:'blue',label:'专利代理'},
    '专利侵权与规避':{icon:'fa-balance-scale',color:'red',label:'侵权与规避'},
    '软件著作权登记':{icon:'fa-copyright',color:'purple',label:'软著登记'},
    '商标代理':{icon:'fa-trademark',color:'orange',label:'商标代理'},
    '专利检索':{icon:'fa-search',color:'teal',label:'检索'},
    '缴费监控':{icon:'fa-hand-holding-usd',color:'pink',label:'缴费监控'}
  };
  let html = `<div class="stat-card"><div class="icon blue"><i class="fas fa-folder-open"></i></div><div class="info"><div class="number">${total}</div><div class="label">总案件</div></div></div>`;

  html += `<div class="stat-card"><div class="icon green"><i class="fas fa-briefcase"></i></div><div class="info"><div class="number">${activeCount}</div><div class="label">活跃案件</div></div></div>`;
  html += `<div class="stat-card"><div class="icon purple"><i class="fas fa-archive"></i></div><div class="info"><div class="number">${archivedCount}</div><div class="label">归档案件</div></div></div>`;
  for (const [k,cfg] of Object.entries(typeMap)){
    const count = byType[k]||0;
    if (count>0) html += `<div class="stat-card"><div class="icon ${cfg.color}"><i class="fas ${cfg.icon}"></i></div><div class="info"><div class="number">${count}</div><div class="label">${cfg.label}</div></div></div>`;
  }
  html += `<div class="stat-card"><div class="icon red"><i class="fas fa-flag"></i></div><div class="info"><div class="number">${byPriority['高']}</div><div class="label">高优先级</div></div></div>`;

// ---------- 标签 ----------
function getAllTags(){
  const set = new Set();
  cases.forEach(c => {
    (c.tags || '').split(',').map(t=>t.trim()).filter(t=>t).forEach(t=>set.add(t));
  });
  return [...set].sort();
}

function renderTagFilters(){
  const container = document.getElementById('tagFilterGroup');
  if (!container) return;
  const all = getAllTags();
  if (!all.length){ container.innerHTML = ''; return; }
  let html = `<button class="filter-btn tag-filter ${!currentTagFilter?'active':''}" onclick="setTagFilter(null)">全部标签</button>`;
  all.forEach(t => {
    html += `<button class="filter-btn tag-filter ${currentTagFilter===t?'active':''}" onclick="setTagFilter('${t.replace(/'/g,"\\'")}')">${t}</button>`;
  });
  container.innerHTML = html;
}

function setTagFilter(tag){
  currentTagFilter = tag;
  renderTable();
}

function getFiltered(){
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = cases.filter(c => {
    // ===== 视图过滤（核心逻辑） =====
    const isEnded = ENDED_STATUSES.includes(c.status);
    if (currentView === 'active' && isEnded) return false;
    if (currentView === 'archived' && !isEnded) return false;
    // currentView === 'all' 时不过滤

    // ===== 类型过滤 =====
    if (currentTypeFilter !== 'all' && c.caseType !== currentTypeFilter) return false;
    // ===== 标签过滤 =====
    if (currentTagFilter){
      const tags = (c.tags||'').split(',').map(t=>t.trim());
      if (!tags.includes(currentTagFilter)) return false;
    }
    // ===== 关键词搜索 =====
    if (kw){
      const s = `${c.caseNumber} ${c.caseName} ${c.clientName} ${c.contactPerson} ${c.notes||''}`.toLowerCase();
      if (!s.includes(kw)) return false;
    }
    return true;
  });
  const { field, asc } = currentSort;
  list.sort((a,b) => {
    let va = a[field]||'', vb = b[field]||'';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
  return list;
}

function renderTable(){
  renderTagFilters();
  const list = getFiltered();
  const tbody = document.getElementById('tableBody');
  document.getElementById('resultCount').textContent = `共 ${list.length} 件`;

  if (list.length === 0){
    let emptyHtml;
    if (currentView === 'archived'){
      emptyHtml = `<i class="fas fa-archive"></i><h3>暂无归档案件</h3><p>状态为「协助缴费」或「已移交专人」的案件会自动归档到这里</p>`;
    } else if (currentView === 'active'){
      emptyHtml = `<i class="fas fa-gavel"></i><h3>暂无活跃案件</h3><p>点击「新建案件」或「批量新建」开始；已结束的案件可在「归档」中查看</p>`;
    } else {
      emptyHtml = `<i class="fas fa-gavel"></i><h3>暂无案件</h3><p>点击「新建案件」或「批量新建」开始</p>`;
    }
    tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state">${emptyHtml}</div></td></tr>`;
    updateSelectedInfo();
    return;
  }

  let html = '';
  list.forEach(c => {
    const tags = (c.tags||'').split(',').map(t=>t.trim()).filter(t=>t);
    const tagHtml = tags.map(t => `<span class="tag-item">${t}</span>`).join('');
    const checked = selectedIds.has(c.id) ? 'checked' : '';
    const isEnded = ENDED_STATUSES.includes(c.status);
    // 归档状态的案件行整体略带灰色调，作为视觉提示
    const rowStyle = isEnded ? 'style="opacity:.82;"' : '';
    html += `<tr class="${checked?'selected':''}" ${rowStyle} data-id="${c.id}">
      <td class="checkbox-col"><input type="checkbox" class="row-checkbox" data-id="${c.id}" ${checked} onchange="toggleRow('${c.id}')" /></td>
      <td><span class="case-id">${c.caseNumber||'-'}</span></td>
      <td><span style="display:inline-block;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;" title="${c.caseName||''}">${c.caseName||'-'}</span></td>
      <td><span style="display:inline-block;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;" title="${c.clientName||''}">${c.clientName||'-'}</span></td>
      <td>${c.caseType||'-'}</td>
      <td><span class="priority-badge ${getPriorityClass(c.priority)}">${c.priority||'中'}</span></td>
      <td><span class="importance-stars">${renderStars(c.importance)}</span></td>
      <td><span class="status-badge ${getStatusClass(c.status)}">${c.status||'-'}</span></td>
      <td><div class="tag-list">${tagHtml}</div></td>
      <td><div class="actions">
        <button class="btn btn-accent btn-xs" onclick="viewDetail('${c.id}')"><i class="fas fa-eye"></i></button>
        <button class="btn btn-accent btn-xs" onclick="openEditModal('${c.id}')"><i class="fas fa-edit"></i></button>
        <button class="btn btn-danger btn-xs" onclick="deleteCase('${c.id}')"><i class="fas fa-trash-alt"></i></button>
      </div></td>
    </tr>`;
  });
  tbody.innerHTML = html;
  updateSelectedInfo();
  const cbs = document.querySelectorAll('.row-checkbox');
  document.getElementById('selectAll').checked = cbs.length>0 && [...cbs].every(cb=>cb.checked);
}

function toggleRow(id){
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if (tr){ tr.classList.toggle('selected', selectedIds.has(id)); const cb = tr.querySelector('.row-checkbox'); if (cb) cb.checked = selectedIds.has(id); }
  updateSelectedInfo();
  const cbs = document.querySelectorAll('.row-checkbox');
  document.getElementById('selectAll').checked = cbs.length>0 && [...cbs].every(cb=>cb.checked);
}

function toggleAllCheckboxes(){
  const checked = document.getElementById('selectAll').checked;
  document.querySelectorAll('.row-checkbox').forEach(cb => {
    const id = cb.dataset.id;
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
    cb.checked = checked;
    const tr = document.querySelector(`tr[data-id="${id}"]`);
    if (tr) tr.classList.toggle('selected', checked);
  });
  updateSelectedInfo();
}

function updateSelectedInfo(){ document.getElementById('selectedInfo').textContent = `已选 ${selectedIds.size} 件`; }
function getSelectedCases(){ return cases.filter(c => selectedIds.has(c.id)); }

function subscribeRealtime(){
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('cases-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:'cases' }, payload => {
      const row = payload.new || payload.old;
      if (payload.eventType === 'DELETE' || row.deleted_at){
        cases = cases.filter(c => c.id !== row.id);
      } else {
        const ui = fromDB(row);
        const idx = cases.findIndex(c => c.id === ui.id);
        if (idx > -1) cases[idx] = ui; else cases.unshift(ui);
      }
      updateHistoryLists(); renderStats(); renderTable();
      setSyncStatus('ok', '已同步 · ' + new Date().toLocaleTimeString());
    })
    .subscribe(status => { if (status === 'SUBSCRIBED') setSyncStatus('ok', '实时同步已连接'); });
}

async function batchDelete(){
  const sel = getSelectedCases();
  if (!sel.length) return toast('请先选择案件','error');
  if (!confirm(`确定删除选中的 ${sel.length} 件？`)) return;
  const ids = sel.map(c => c.id);
  const { error } = await sb.from('cases').update({ deleted_at: new Date().toISOString() }).in('id', ids);
  if (error) return toast('删除失败：'+error.message,'error');
  cases = cases.filter(c => !ids.includes(c.id));
  selectedIds.clear(); renderStats(); renderTable();
  toast(`已删除 ${sel.length} 件`,'success');
}

async function batchUpdateStatus(){
  const s = document.getElementById('batchStatusSelect').value;
  if (!s) return toast('请选择状态','error');
  const sel = getSelectedCases();
  if (!sel.length) return toast('请先选择案件','error');
  const ids = sel.map(c => c.id);
  const { error } = await sb.from('cases').update({ status: s, updated_at: new Date().toISOString() }).in('id', ids);
  if (error) return toast('更新失败：'+error.message,'error');
  cases = cases.map(c => ids.includes(c.id) ? { ...c, status: s } : c);
  selectedIds.clear(); renderStats(); renderTable();
  document.getElementById('batchStatusSelect').value = '';
  // 如果新状态是结束状态，提示用户案件已转入归档
  const isArchived = ENDED_STATUSES.includes(s);
  toast(`已更新 ${sel.length} 件${isArchived ? '，已转入归档' : ''} ✅`,'success');
}

async function saveCase(e){
  e.preventDefault();
  const editId = document.getElementById('editId').value;
  const editVersion = parseInt(document.getElementById('editVersion').value) || 1;
  const formData = {
    caseNumber: document.getElementById('f_caseNumber').value.trim(),
    caseName: document.getElementById('f_caseName').value.trim(),
    clientName: document.getElementById('f_clientName').value.trim(),
    caseType: document.getElementById('f_caseType').value,
    contactPerson: document.getElementById('f_contactPerson').value.trim(),
    contactPhone: document.getElementById('f_contactPhone').value.trim(),
    receiveDate: document.getElementById('f_receiveDate').value,
    submitDate: document.getElementById('f_submitDate').value||'',
    paymentDate: document.getElementById('f_paymentDate').value||'',
    transferDate: document.getElementById('f_transferDate').value||'',
    status: document.getElementById('f_status').value,
    priority: document.getElementById('f_priority').value,
    importance: document.getElementById('f_importance').value,
    tags: document.getElementById('f_tags').value.trim(),
    notes: document.getElementById('f_notes').value.trim()
  };
  if (!formData.caseNumber || !formData.caseName || !formData.clientName || !formData.contactPerson || !formData.receiveDate){
    return toast('请填写所有必填项','error');
  }
  const payload = toDB(formData);
  const isArchived = ENDED_STATUSES.includes(formData.status);

  try {
    if (editId){
      const { data, error } = await sb.from('cases')
        .update({ ...payload, version: editVersion+1, updated_at: new Date().toISOString() })
        .eq('id', editId).eq('version', editVersion).select();
      if (error) throw error;
      if (!data || !data.length) return toast('案件已被其他设备修改，请刷新','error');
      const idx = cases.findIndex(c => c.id === editId);
      if (idx > -1) cases[idx] = fromDB(data[0]);
      toast(isArchived ? '已更新，该案件已归档' : '已更新','success');
    } else {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return toast('请先登录','error');
      const { data, error } = await sb.from('cases').insert({ ...payload, user_id: user.id }).select();
      if (error){
        if (error.code === '23505') return toast('编号已存在','error');
        throw error;
      }
      cases.unshift(fromDB(data[0]));
      toast(isArchived ? '已创建（已归档）' : '已创建','success');
    }
    closeModal();
    updateHistoryLists(); renderStats(); renderTable();
  } catch(err){
    toast('保存失败：'+err.message,'error');
  }
}

async function submitBatch(){
  const clientName = document.getElementById('batch_clientName').value.trim();
  const caseType = document.getElementById('batch_caseType').value;
  const contactPerson = document.getElementById('batch_contactPerson').value.trim();
  const contactPhone = document.getElementById('batch_contactPhone').value.trim();
  const receiveDate = document.getElementById('batch_receiveDate').value;
  const priority = document.getElementById('batch_priority').value;
  const importance = document.getElementById('batch_importance').value;
  const baseTags = document.getElementById('batch_tags').value.trim();
  const status = document.getElementById('batch_status').value;

  if (!clientName || !contactPerson || !receiveDate){
    return toast('请填写完整的通用信息（客户、联系人、收案日期）','error');
  }

  const rows = document.querySelectorAll('#batchTableBody tr');
  const details = [];
  for (const tr of rows){
    const name = tr.querySelector('.batch-case-name').value.trim();
    let number = tr.querySelector('.batch-case-number').value.trim();
    const notes = tr.querySelector('.batch-case-notes').value.trim();
    if (!name) return toast('每行必须填写案件名称','error');
    if (!number) number = generateBatchNumber(caseType, receiveDate, details.map(d => d.caseNumber));
    if (cases.some(c => c.caseNumber === number) || details.some(d => d.caseNumber === number)){
      return toast(`编号 ${number} 已存在，请修改`,'error');
    }
    details.push({ caseNumber: number, caseName: name, notes });
  }
  if (!details.length) return toast('请至少添加一行','error');

  const { data: { user } } = await sb.auth.getUser();
  if (!user) return toast('请先登录','error');

  const payload = details.map(d => ({
    user_id: user.id,
    case_number: d.caseNumber,
    case_name: d.caseName,
    client_name: clientName,
    case_type: caseType,
    contact_person: contactPerson,
    contact_phone: contactPhone || null,
    receive_date: receiveDate,
    submit_date: null,
    payment_date: null,
    transfer_date: null,
    status: status,
    priority: priority,
    importance: parseInt(importance) || 3,
    tags: baseTags || null,
    notes: d.notes || null
  }));

  const btn = document.getElementById('batchSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';

  try {
    const { data, error } = await sb.from('cases').insert(payload).select();
    if (error){
      if (error.code === '23505') return toast('存在重复的案件编号，请检查后重试','error');
      throw error;
    }
    cases.unshift(...data.map(fromDB));
    closeBatchModal();
    updateHistoryLists(); renderStats(); renderTable();
    const isArchived = ENDED_STATUSES.includes(status);
    toast(`成功批量创建 ${data.length} 件${isArchived ? '（已归档）' : ''} ✅`,'success');
  } catch(err){
    toast('批量创建失败：'+err.message,'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> 批量提交';
  }
}

function downloadCSV(list, filename){
  const headers = ['案件编号','案件名称','客户名称','业务类型','联系人','联系方式','收案日期','提交受理日期','缴费日期','移交日期','状态','优先级','重要性','标签','备注'];
  const rows = list.map(c => [c.caseNumber||'',c.caseName||'',c.clientName||'',c.caseType||'',c.contactPerson||'',c.contactPhone||'',c.receiveDate||'',c.submitDate||'',c.paymentDate||'',c.transferDate||'',c.status||'',c.priority||'中',c.importance||'3',(c.tags||'').replace(/,/g,';'),(c.notes||'').replace(/,/g,';')]);
  const csv = [headers.join(','), ...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportCSV(){
  if (!cases.length) return toast('没有案件','error');
  // 导出当前视图下的案件（活跃/归档/全部），让导出更符合当前上下文
  const list = getFiltered();
  if (!list.length) return toast('当前视图没有案件可导出','info');
  const viewLabel = currentView === 'active' ? '活跃' : (currentView === 'archived' ? '归档' : '全部');
  downloadCSV(list, `IP案件_${viewLabel}_${new Date().toISOString().slice(0,10)}.csv`);
  toast(`已导出 ${list.length} 件（${viewLabel}）`,'success');
}

async function importCSV(event){
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const lines = e.target.result.split('\n').filter(l => l.trim());
      if (lines.length < 2) return toast('CSV 无效','error');
      const headers = lines[0].split(',').map(h=>h.trim());
      const expected = ['案件编号','案件名称','客户名称','业务类型','联系人','联系方式','收案日期','提交受理日期','缴费日期','移交日期','状态','优先级','重要性','标签','备注'];
      const idxMap = {};
      expected.forEach((h,i) => { const idx = headers.findIndex(x => x.includes(h)); idxMap[h] = idx!==-1?idx:i; });
      const validStatus = ['收案','处理中','待提交','已提交受理','协助缴费','已移交专人'];
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return toast('请先登录','error');
      const toInsert = [];
      for (let i=1; i<lines.length; i++){
        const cols = lines[i].split(',').map(s=>s.trim());
        const get = k => cols[idxMap[k]] || '';
        let st = get('状态'); if (!validStatus.includes(st)) st = '收案';
        const num = get('案件编号') || `IMP-${String(i).padStart(4,'0')}`;
        if (cases.some(c => c.caseNumber === num)) continue;
        toInsert.push({
          user_id: user.id,
          case_number: num,
          case_name: get('案件名称') || '未命名',
          client_name: get('客户名称') || '未知',
          case_type: get('业务类型') || '专利代理',
          contact_person: get('联系人') || '',
          contact_phone: get('联系方式') || '',
          receive_date: get('收案日期') || null,
          submit_date: get('提交受理日期') || null,
          payment_date: get('缴费日期') || null,
          transfer_date: get('移交日期') || null,
          status: st,
          priority: get('优先级') || '中',
          importance: parseInt(get('重要性')) || 3,
          tags: get('标签') || '',
          notes: get('备注') || ''
        });
      }
      if (!toInsert.length) return toast('没有新数据','info');
      const { data, error } = await sb.from('cases').insert(toInsert).select();
      if (error) return toast('导入失败：'+error.message,'error');
      cases.unshift(...data.map(fromDB));
      updateHistoryLists(); renderStats(); renderTable();
      const archivedCount = data.filter(r => ENDED_STATUSES.includes(r.status)).length;
      toast(`导入 ${data.length} 件${archivedCount ? `（其中 ${archivedCount} 件已归档）` : ''}`,'success');
    } catch(err){ toast('导入失败：'+err.message,'error'); }
    event.target.value = '';
  };
  reader.readAsText(file,'UTF-8');
}

function toast(msg, type='info'){
  const c = document.getElementById('toastContainer');
  const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-icon"><i class="fas ${icons[type]}"></i></span><span class="toast-msg">${msg}</span><button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>`;
  c.appendChild(el);
  setTimeout(() => { if (el.parentElement) el.remove(); }, 3500);
}
